<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="back11()">back(2)</button>
    <button onclick="back1()">back1</button>
    <button onclick="next1()">next1</button>
    <button onclick="next11()">next(2)</button>

    <script>
        function back11(){
            history.go(-2);
        }
        function back1(){
            history.back();
        }
        function next1(){
            history.forward();
        }
        function next11(){
            history.go(2);
        }
    </script>
</body>
</html>
