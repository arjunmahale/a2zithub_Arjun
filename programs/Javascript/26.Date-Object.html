<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="margin: 50px; font-size: x-large;">
    <script>
        var d=new Date();
        document.write(d);
        document.write("<br> date :"+d.getDate());
        document.write("<br> day :"+d.getDay());
      switch(d.getDay()) {
            case 0: 
                document.write("<br> Day (name): Sunday"); 
                break;
            case 1: 
                document.write("<br> Day (name): Monday"); 
                break;
            case 2: 
                document.write("<br> Day (name): Tuesday"); 
                break;
            case 3: 
                document.write("<br> Day (name): Wednesday"); 
                break;
            case 4: 
                document.write("<br> Day (name): Thursday"); 
                break;
            case 5: 
                document.write("<br> Day (name): Friday"); 
                break;
            case 6: 
                document.write("<br> Day (name): Saturday"); 
                break;
        }


        document.write("<br>year :"+d.getFullYear());
        document.write("<br>hours :"+d.getHours());
        document.write("<br>minutes:"+d.getMinutes());
        document.write("<br>seconds:"+d.getSeconds());
        document.write("<br>miliseconds:"+d.getMilliseconds());
        
        
        





    </script>
</body>
</html>
