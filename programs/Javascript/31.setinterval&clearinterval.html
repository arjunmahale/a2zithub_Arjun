<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            background: red;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <button onclick="start1()">start</button>
    <button onclick="stop1()">stop</button>
    <script>
    var idd;
    var a=50;
function start1(){
    idd=setInterval(mar,1000);
}

function mar(){
    a+=50;
    document.getElementsByClassName('box')[0].style.marginLeft=a+'px';
}
function stop1(){

    clearInterval(idd);
}

    </script>
</body>
</html>
