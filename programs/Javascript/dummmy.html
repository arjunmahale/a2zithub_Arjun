<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=
  , initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Document</title>
</head>
<body>
<center><h2>counting algorithm using javascript</h2> <h1></h1>
  <button class="btn btn-primary" onclick="start()">start counting</button></center>
 
  <script>
  var interval;
    document.getElementsByTagName('h1')[0].innerText=1;
    var num=1;
    function count(){
      num++;
      if(num<=200){
        document.getElementsByTagName('h1')[0].innerText=num;
      }
      else{
         document.getElementsByTagName('h1')[0].innerText+="+";
       clearInterval(interval);
      }

    }
 
    function start(){
         interval =setInterval(count,10);

    }
    
  </script>

</body>
</html>
