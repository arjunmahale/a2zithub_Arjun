<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Popular Projects</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      margin: 0;
      padding: 40px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .projects-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .project-card {
      position: relative;
      width: 400px;
      height: 300px;
      overflow: hidden;
      border-radius: 15px;
      background-size: cover;
      background-position: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .project-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

  .overlay {
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 85, 0, 0.9);
 clip-path: polygon(0 0, 40% 0, 100% 100%, 0 100%);

  transition: top 0.4s ease;
  z-index: 1;
}


    .project-card:hover .overlay {
      top: 0;
    }

    .content {
      position: absolute;
      bottom: 30px;
      left: 30px;
      z-index: 2;
      color: white;
      opacity: 0;
      transform: translateY(20px);
      transition: 0.3s ease;
    }

    .project-card:hover .content {
      opacity: 1;
      transform: translateY(0);
    }

    .content h4 {
      margin: 0;
      font-size: 16px;
      opacity: 0.8;
    }

    .content h3 {
      margin: 5px 0 15px;
      font-size: 20px;
    }

    .content .arrow {
      width: 40px;
      height: 40px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f04900;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>


  <!-- Parent container to align section title and boxes vertically -->
  <div style="width: 100%; padding: 0 40px;">

    <!-- First row: Section title aligned to left -->
    <div class="section-title" style="margin-bottom: 40px;">
      <h4 style="color: #f04900;">POPULAR PROJECTS</h4>
      <h1>Our Completed Projects</h1>
    </div>

    <!-- Second row: All 3 boxes in a single row -->
    <div class="projects-container">
      <!-- Project 1 -->
      <div class="project-card" style="background-image: url('https://via.placeholder.com/300x350/000000/FFFFFF?text=Project+1');">
        <div class="overlay"></div>
        <div class="content">
          <h4>UI & UX, IT Solution</h4>
          <h3>SmartRics Web Solution</h3>
          <div class="arrow">→</div>
        </div>
      </div>

      <!-- Project 2 -->
      <div class="project-card" style="background-image: url('https://via.placeholder.com/300x350/cccccc/000000?text=Project+2');">
        <div class="overlay"></div>
        <div class="content">
          <h4>Mobile App, Cloud</h4>
          <h3>FinTech App Project</h3>
          <div class="arrow">→</div>
        </div>
      </div>

      <!-- Project 3 -->
      <div class="project-card" style="background-image: url('https://via.placeholder.com/300x350/eeeeee/000000?text=Project+3');">
        <div class="overlay"></div>
        <div class="content">
          <h4>Branding, Strategy</h4>
          <h3>Creative Design</h3>
          <div class="arrow">→</div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
