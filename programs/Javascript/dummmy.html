<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Bar Toggle</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="margin: 0; font-family: Arial, sans-serif;">
<!-- Search Icon Button -->
<div onclick="show()" class="icon-circle" style="position: fixed; top: 20px; right: 20px; z-index: 1050; background-color: #fc4c02; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;">
  <i class="fas fa-search"></i>
</div>

<!-- Search Bar -->
<div id="search-bar"
     class="container-fluid"
     style="display: none; position: fixed; top: 0; left: 0; width: 100%; z-index: 1040;">
  <div class="row justify-content-center py-4 shadow-sm" style="background-color: #ffffff;">
    <div class="col-12 col-md-8 d-flex justify-content-center">
      <div class="d-flex w-100 bg-light rounded-3 overflow-hidden" style="max-width: 100%;">
        <input type="text"
               placeholder="Search by keyword or #"
               class="form-control border-0 bg-light px-4 py-3"
               style="font-size: 16px;">
        <button class="btn text-white px-4"
                style="background-color: #fc4c02;">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- JavaScript -->
<script>
  function show() {
    document.getElementById('search-bar').style.display = 'block';
  }
</script>


<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome for icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

</body>
</html>
