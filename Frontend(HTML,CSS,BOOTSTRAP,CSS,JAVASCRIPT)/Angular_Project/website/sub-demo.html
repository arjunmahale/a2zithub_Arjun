






<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Bidding Static Grid</title>
  <style>
    *{
        color: white;
    }
 .sd1-card-wrapper {
  position: relative;
  min-width: 240px;
  height:auto;
  border-radius: 12px;
}

.sd1-bg-div {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(to left, #131722, rgba(4,145,226));
  background-size: cover;
  background-position: center;
  border-radius: 12px;
  z-index: 1;
  transition: transform 0.4s ease, background-size 0.4s ease;
}

.sd1-card-wrapper:hover .sd1-bg-div {
  transform: translateY(10px) translateX(-5px) rotate(2deg);
  background-size: 110%;
}

.sd1-content-div {
  position: relative;
  width: 100%;
  height: auto;
  border-radius: 12px;
  overflow: hidden;
  z-index: 2;
  display: flex;
  flex-direction: column;
}

.sd1-top-div {
  flex: 7;
  background-size: 100%;
  background-position: center;
  background-repeat: no-repeat;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  padding-bottom: 6px;
  height: 350px;
  transition: background-size 0.3s ease-in-out;
}

.sd1-top-div:hover {
  background-size: 110%;
}

.sd1-timer-div {
  display: flex;
 min-height: 180px;
 align-items: end;
  justify-content: space-between;
  width: 100%;
  padding: 8 6px;
  font-size: 12px;
}

.sd1-timer-div > div {
  text-align: center;
  flex: 1;
}

.sd1-bottom-div {
  flex: 3;
  background: #131722;
  padding: 5px;
  box-sizing: border-box;
  height: max-content;
}

.sd1-bottom-div p {
  padding: 2px;
}

.sd1-avatars {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 2px;
  margin-top: 2px;
}

.sd1-avatars img {
  width: 25px;
  height: 25px;
  border-radius: 50%;
  border: 1px solid #fff;
}

.sd1-avatars span {
  font-size: small;
  color: #bbb;
}

.sd1-eth {
  color: #03a9f4;
  font-size: small;
  font-weight: bold;
}

  </style>
</head>
<body>
  <div class="sd1-card-wrapper">
        <div class="sd1-bg-div" style="background-image: linear-gradient(rgba(16,48,75,0.8), rgba(4,145,226,0.8)), url('https://via.placeholder.com/240x300?text=1');"></div>
        <div class="sd1-content-div">
          <div class="sd1-top-div" style="background-image: url('slider1.jpg');">
            <div class="sd1-timer-div">
              <div><div>00</div><small>D'S</small></div>
              <div><div>00</div><small>H'S</small></div>
              <div><div>00</div><small>MIN'S</small></div>
              <div><div>00</div><small>SEC</small></div>
            </div>
          </div>
          <div class="sd1-bottom-div">
            <div class="sd1-avatars">
              <img src="client-1.64bd52dc.png" alt="avatar" style="transform: translateX(13px);">
              <img src="client-10.916ce2a4.png" alt="avatar">
              <img src="client-11.bfc29ff8.png" alt="avatar"style="transform: translateX(-13px);">
              <span>20+ Place Bit.</span>
            </div>
            <p style="font-size: larger; font-weight: 600;">Preatent</p>
            <p style="color: #ccc;">Highest bid 1/20</p>
            <p class="sd1-eth">0.244wETH</p>
          </div>
        </div>
      </div>

      
</body>
</html>
