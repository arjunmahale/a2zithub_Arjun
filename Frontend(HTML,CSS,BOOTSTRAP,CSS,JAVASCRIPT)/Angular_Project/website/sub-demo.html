<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Collection Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #181A24;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .l22collection-wrapper {
      background-color: #1f2233;
      border-radius: 12px;
      width: 20%;
      margin: 30px auto;
      padding-bottom: 50px;
      position: relative;
      overflow: hidden;
    }

    .l22main-img {
      width: 100%;
      height: min-content;
      border-radius: 12px 12px 0 0;
      display: block;
    }

    .l22bottom-section {
      padding: 10px;
      text-align: center;
      height: auto;
    }

    .l22collection-name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .l22sub-images {
      display: flex;
      gap: 8px;
      margin-top: 5%;
    }

    .l22sub-images img {
      width: 33%;
      height: 62px;
      border-radius: 8px;
      object-fit: cover;
    }

    .l22avatar-wrapper {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -70%);
      width: 100px;
      height: 100px;
      z-index: 2;
    }

    .l22avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid #1f2233;
      object-fit: cover;
    }

    .l22items-tag {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      margin-top: 1%;
      font-size: 12px;
      padding: 2px 5px;
      width: 100%;
      border-radius: 6px;
      z-index: 3;
    }

    @media screen and (max-width: 480px) {
      .l22collection-wrapper {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <div style="width: auto; height: auto; align-items: center; justify-content: center; display: flex; flex-direction: row; padding: 7%; flex-wrap: wrap;">

    <div class="l22collection-wrapper">
      <img src="client-12.fa2ef573.png" class="l22main-img" alt="Main Image" />
      
      <div class="l22bottom-section">
        <div class="l22collection-name"> 
          <div class="l22avatar-wrapper">
            <img src="client-8.ae28ec40.png" alt="Avatar" />
          </div>
        </div>
        
        <div class="l22sub-images">

          <img src="client-9.092c92e2.png" alt="Sub 2" />
        </div>

      <div class="l22items-tag">
        <span style="padding-left: 10px; font-size: large; font-weight: 700;">Cubic Trad</span>
