<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap 5 Grid - 10 Cards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .exp-custom-card {
      background-color: #191925;
      border-radius: 12px;
      color: #fff;
      padding: 20px;
      text-align: center;
      transition: transform 0.3s ease;
      height: 100%;
    }

    .exp-custom-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .exp-card-wrapper {
      position: relative;
      min-width: 240px;
      height: auto;
      border-radius: 12px;
    }

    .exp-bg-div {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to left, #131722, rgba(4,145,226));
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      z-index: 1;
      transition: transform 0.4s ease, background-size 0.4s ease;
    }

    .exp-card-wrapper:hover .exp-bg-div {
      transform: translateY(10px) translateX(-5px) rotate(2deg);
      background-size: 110%;
    }

    .exp-content-div {
      position: relative;
      width: 100%;
      height: auto;
      border-radius: 12px;
      overflow: hidden;
      z-index: 2;
      display: flex;
      flex-direction: column;
    }

    .exp-top-div {
      flex: 7;
      background-size: 100%;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: 6px;
      height: 350px;
      transition: background-size 0.3s ease-in-out;
    }

    .exp-top-div:hover {
      background-size: 110%;
    }

    .exp-timer-div {
      display: flex;
      min-height: 180px;
      align-items: end;
      justify-content: space-between;
      width: 100%;
      padding: 8px 6px;
      font-size: 12px;
    }

    .exp-timer-div > div {
      text-align: center;
      flex: 1;
    }

    .exp-bottom-div {
      flex: 3;
      background: #131722;
      padding: 5px;
      box-sizing: border-box;
      height: max-content;
    }

    .exp-bottom-div p {
      padding: 2px;
    }

    .exp-avatars {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
      margin-top: 2px;
    }

    .exp-avatars img {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      border: 1px solid #fff;
    }

    .exp-avatars span {
      font-size: small;
      color: #bbb;
    }

    .exp-eth {
      color: #03a9f4;
      font-size: small;
      font-weight: bold;
    }

    .exp-col-custom {
      flex: 0 0 20%;
      max-width: 20%;
    }

    @media (max-width: 991.98px) {
      .exp-col-custom {
        flex: 0 0 33.3333%;
        max-width: 33.3333%;
      }
    }

    @media (max-width: 767.98px) {
      .exp-col-custom {
        flex: 0 0 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body style="background-color: #121212;">

  <div class="container py-5">
    <div class="row g-4">

      <div class="exp-col-custom">
        <div class="exp-custom-card">
          <div class="exp-card-wrapper">
            <div class="exp-bg-div" style="background-image: linear-gradient(rgba(16,48,75,0.8), rgba(4,145,226,0.8)), url('https://via.placeholder.com/240x300?text=1');"></div>
            <div class="exp-content-div">
              <div class="exp-top-div" style="background-image: url('slider1.jpg');">
                <div class="exp-timer-div">
                  <div><div>00</div><small>D'S</small></div>
                  <div><div>00</div><small>H'S</small></div>
                  <div><div>00</div><small>MIN'S</small></div>
                  <div><div>00</div><small>SEC</small></div>
                </div>
              </div>
              <div class="exp-bottom-div">
                <div class="exp-avatars">
                  <img src="client-1.64bd52dc.png" alt="avatar" style="transform: translateX(13px);">
                  <img src="client-10.916ce2a4.png" alt="avatar">
                  <img src="client-11.bfc29ff8.png" alt="avatar" style="transform: translateX(-13px);">
                  <span>20+ Place Bit.</span>
                </div>
                <p style="font-size: larger; font-weight: 600;text-align: start;">Preatent</p>
                <p style="color: #ccc;text-align: start;">Highest bid 1/20</p>
                <p class="exp-eth" style="text-align: start;">0.244wETH</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Duplicate above block 9 more times to complete 10 cards -->
      <div class="exp-col-custom">
        <div class="exp-custom-card">
          <div class="exp-card-wrapper">
            <div class="exp-bg-div" style="background-image: linear-gradient(rgba(16,48,75,0.8), rgba(4,145,226,0.8)), url('https://via.placeholder.com/240x300?text=1');"></div>
            <div class="exp-content-div">
              <div class="exp-top-div" style="background-image: url('slider1.jpg');">
                <div class="exp-timer-div">
                  <div><div>00</div><small>D'S</small></div>
                  <div><div>00</div><small>H'S</small></div>
                  <div><div>00</div><small>MIN'S</small></div>
                  <div><div>00</div><small>SEC</small></div>
                </div>
              </div>
              <div class="exp-bottom-div">
                <div class="exp-avatars">
                  <img src="client-1.64bd52dc.png" alt="avatar" style="transform: translateX(13px);">
                  <img src="client-10.916ce2a4.png" alt="avatar">
                  <img src="client-11.bfc29ff8.png" alt="avatar" style="transform: translateX(-13px);">
                  <span>20+ Place Bit.</span>
                </div>
                <p style="font-size: larger; font-weight: 600;text-align: start;">Preatent</p>
                <p style="color: #ccc;text-align: start;">Highest bid 1/20</p>
                <p class="exp-eth" style="text-align: start;">0.244wETH</p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Duplicate above block 9 more times to complete 10 cards -->

    </div>
  </div>
</body>
</html>
