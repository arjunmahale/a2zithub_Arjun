<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Bidding Slider</title>
  <style>
    body {
      background: #131722;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .live-bidding-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1000px;
      margin-bottom: 20px;
    }

    .live-bidding-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .circle {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2196f3;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.6; }
      100% { transform: scale(1); opacity: 1; }
    }

    .slider-buttons .slider-btn {
      background: #222;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .slider-wrapper {
      overflow: hidden;
      max-width: 1000px;
      width: 100%;
    }

    .card-container {
      display: flex;
      gap: 20px;
      transition: transform 0.5s ease;
    }

    .bid-card {
      min-width: 240px;
      height: 300px;
      border-radius: 12px;
      background-size: cover;
      background-position: center;
      overflow: hidden;
      position: relative;
      transition: transform 0.4s ease, box-shadow 0.4s ease, background-size 0.4s ease;
    }

    .bid-card:hover {
      transform: translateY(-8px);
      background-size: 110%; /* slight zoom effect */
      box-shadow: 0 20px 40px rgba(0, 174, 255, 0.4);
    }

    .content {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      box-sizing: border-box;
    }

    .timer {
      text-align: center;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .info p {
      margin: 2px 0;
    }

    .eth {
      color: #03a9f4;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="live-bidding-header">
    <div class="live-bidding-title">
      <span class="circle"></span>
      <h2>Live Bidding</h2>
    </div>
    <div class="slider-buttons">
      <button class="slider-btn" onclick="slide(-1)">&#8249;</button>
      <button class="slider-btn" onclick="slide(1)">&#8250;</button>
    </div>
  </div>

  <div class="slider-wrapper">
    <div class="card-container" id="cardContainer">
    

      
      
    </div>
  </div>

  <script>
    let offset = 0;
    const cardWidth = 260;
    const container = document.getElementById('cardContainer');

    function slide(dir) {
      const wrapperWidth = document.querySelector('.slider-wrapper').offsetWidth;
      const maxScroll = (container.children.length * cardWidth) - wrapperWidth;

      offset += dir * cardWidth;
      if (offset < 0) offset = 0;
      if (offset > maxScroll) offset = maxScroll;

      container.style.transform = `translateX(-${offset}px)`;
    }
  </script>

</body>
</html>
